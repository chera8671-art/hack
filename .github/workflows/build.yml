name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Create full Android project
      run: |
        rm -rf app gradle build.gradle settings.gradle gradle.properties .gradle
        mkdir -p app/src/main/java/com/example/aimai
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml

    - name: Create root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            ext.kotlin_version = '1.8.20'
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = 'AIAimAssistant'
        EOF

    - name: Create gradle.properties
      run: |
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

    - name: Create app/build.gradle
      run: |
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.example.aimai'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.aimai"
                minSdk 26
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

            kotlinOptions {
                jvmTarget = '1.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.8.0'
        }
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application
                android:allowBackup="true"
                android:label="🎯 AI Aim Pro"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".FloatingAIService"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

    - name: Create colors.xml
      run: |
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <resources>
            <color name="black">#FF000000</color>
            <color name="white">#FFFFFFFF</color>
        </resources>
        EOF

    - name: Create strings.xml
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">AI Aim Pro</string>
            <string name="accessibility_desc">AI Aim Service</string>
        </resources>
        EOF

    - name: Create activity_main.xml
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="16dp">
            <TextView android:text="🎯 AI Aim Pro" android:textSize="24sp" android:textStyle="bold" android:layout_marginBottom="24dp"/>
            <Button android:id="@+id/btnStart" android:text="Start AI Assistant" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
            <Button android:id="@+id/btnStop" android:text="Stop" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="12dp"/>
            <Button android:id="@+id/btnAccessibility" android:text="Enable Accessibility" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="24dp"/>
        </LinearLayout>
        EOF

    - name: Create floating_menu_ai.xml
      run: |
        cat << 'EOF' > app/src/main/res/layout/floating_menu_ai.xml
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:background="#CC000000"
            android:padding="12dp"
            android:elevation="10dp">
            <TextView android:text="🎯 AI Aim Pro" android:textColor="#FFD700" android:textStyle="bold" android:layout_marginBottom="8dp"/>
            <Button android:id="@+id/btnAnalyze" android:text="🧠 AI Analyze" android:layout_width="wrap_content" android:layout_height="40dp" android:background="@android:color/holo_green_dark" android:textColor="#FFFFFF"/>
            <Button android:id="@+id/btnSetWhite" android:text="⚪ Set White" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="4dp"/>
            <Button android:id="@+id/btnSetTarget" android:text="🎯 Set Target" android:layout_width="wrap_content" android:layout_height="wrap_content"/>
            <Button android:id="@+id/btnClose" android:text="❌ Close" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:background="@android:color/holo_red_dark" android:textColor="#FFFFFF"/>
        </LinearLayout>
        EOF

    - name: Create bg_floating_ai.xml
      run: |
        cat << 'EOF' > app/src/main/res/drawable/bg_floating_ai.xml
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#CC000000"/>
            <corners android:radius="16dp"/>
            <stroke android:width="1dp" android:color="#FFD700"/>
        </shape>
        EOF

    - name: Create accessibility_service_config.xml
      run: |
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_desc"
            android:notificationTimeout="100" />
        EOF

    - name: Create AimMath.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/AimMath.kt
        package com.example.aimai
        import kotlin.math.*
        object AimMath {
            fun angleBetween(x1: Float, y1: Float, x2: Float, y2: Float): Double = atan2(y2 - y1, x2 - x1)
            fun distance(x1: Float, y1: Float, x2: Float, y2: Float): Float = hypot(x2 - x1, y2 - y1)
            fun ghostBall(cueX: Float, cueY: Float, targetX: Float, targetY: Float, ballRadius: Float = 28f): Pair<Float, Float> {
                val angle = angleBetween(cueX, cueY, targetX, targetY)
                val dx = cos(angle).toFloat() * ballRadius * 2
                val dy = sin(angle).toFloat() * ballRadius * 2
                return Pair(targetX - dx, targetY - dy)
            }
            fun pointOnLine(start: Pair<Float,Float>, dir: Pair<Float,Float>, t: Float): Pair<Float,Float> {
                return Pair(start.first + dir.first * t, start.second + dir.second * t)
            }
        }
        EOF

    - name: Create PhysicsEngine.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/PhysicsEngine.kt
        package com.example.aimai
        import kotlin.math.*
        data class BallData(val x: Float, val y: Float, val radius: Float, val color: Int)
        class PhysicsEngine(val tableWidth: Float = 1000f, val tableHeight: Float = 1600f) {
            data class PredictionPath(val points: List<Pair<Float,Float>>, val hitBall: BallData?)
            fun computeFullPath(cue: Pair<Float,Float>, direction: Pair<Float,Float>,
                                allBalls: List<BallData>, pockets: List<Pair<Float,Float>>): PredictionPath {
                val points = mutableListOf(cue)
                var currentPos = cue
                var currentDir = direction
                var hitBall: BallData? = null
                var bounces = 0
                var steps = 0
                while (bounces < 4 && steps < 200) {
                    val next = findNextCollision(currentPos, currentDir, allBalls)
                    if (next == null) {
                        val far = extendLine(currentPos, currentDir)
                        points.add(far)
                        break
                    }
                    points.add(next.point)
                    if (next.type == "ball") {
                        hitBall = next.ball
                        if (next.ball != null && pockets.isNotEmpty()) {
                            val nearest = pockets.minByOrNull { AimMath.distance(next.ball!!.x, next.ball!!.y, it.first, it.second) }
                            if (nearest != null) {
                                points.add(Pair(nearest.first, nearest.second))
                            }
                        }
                        break
                    } else {
                        currentPos = next.point
                        currentDir = reflectDirection(currentDir, next.edge!!)
                        bounces++
                    }
                    steps++
                }
                return PredictionPath(points, hitBall)
            }
            private data class Collision(val point: Pair<Float,Float>, val type: String, val ball: BallData?, val edge: String?)
            private fun findNextCollision(pos: Pair<Float,Float>, dir: Pair<Float,Float>,
                                          balls: List<BallData>): Collision? {
                var closestDist = Float.MAX_VALUE
                var closestBall: BallData? = null
                for (ball in balls) {
                    val toBallX = ball.x - pos.first
                    val toBallY = ball.y - pos.second
                    val cross = dir.first * toBallY - dir.second * toBallX
                    val distToLine = abs(cross) / hypot(dir.first, dir.second)
                    if (distToLine < ball.radius) {
                        val t = (toBallX * dir.first + toBallY * dir.second) / (dir.first*dir.first + dir.second*dir.second)
                        if (t > 0 && t < closestDist) {
                            closestDist = t
                            closestBall = ball
                        }
                    }
                }
                val edgeCollision = findEdgeCollision(pos, dir)
                if (closestBall != null && closestDist < edgeCollision.distance) {
                    val impact = AimMath.pointOnLine(pos, dir, closestDist)
                    return Collision(impact, "ball", closestBall, null)
                }
                if (edgeCollision.distance < Float.MAX_VALUE) {
                    return Collision(edgeCollision.point, "edge", null, edgeCollision.edge)
                }
                return null
            }
            private data class EdgeCollision(val point: Pair<Float,Float>, val distance: Float, val edge: String)
            private fun findEdgeCollision(pos: Pair<Float,Float>, dir: Pair<Float,Float>): EdgeCollision {
                var bestDist = Float.MAX_VALUE
                var bestPoint = Pair(0f,0f)
                var bestEdge = ""
                if (dir.first != 0f) {
                    val tLeft = (0f - pos.first) / dir.first
                    if (tLeft > 0) {
                        val y = pos.second + dir.second * tLeft
                        if (y in 0f..tableHeight && tLeft < bestDist) {
                            bestDist = tLeft; bestPoint = Pair(0f, y); bestEdge = "left"
                        }
                    }
                    val tRight = (tableWidth - pos.first) / dir.first
                    if (tRight > 0) {
                        val y = pos.second + dir.second * tRight
                        if (y in 0f..tableHeight && tRight < bestDist) {
                            bestDist = tRight; bestPoint = Pair(tableWidth, y); bestEdge = "right"
                        }
                    }
                }
                if (dir.second != 0f) {
                    val tTop = (0f - pos.second) / dir.second
                    if (tTop > 0) {
                        val x = pos.first + dir.first * tTop
                        if (x in 0f..tableWidth && tTop < bestDist) {
                            bestDist = tTop; bestPoint = Pair(x, 0f); bestEdge = "top"
                        }
                    }
                    val tBottom = (tableHeight - pos.second) / dir.second
                    if (tBottom > 0) {
                        val x = pos.first + dir.first * tBottom
                        if (x in 0f..tableWidth && tBottom < bestDist) {
                            bestDist = tBottom; bestPoint = Pair(x, tableHeight); bestEdge = "bottom"
                        }
                    }
                }
                return EdgeCollision(bestPoint, bestDist, bestEdge)
            }
            private fun reflectDirection(dir: Pair<Float,Float>, edge: String): Pair<Float,Float> {
                return when (edge) {
                    "left", "right" -> Pair(-dir.first, dir.second)
                    "top", "bottom" -> Pair(dir.first, -dir.second)
                    else -> dir
                }
            }
            private fun extendLine(pos: Pair<Float,Float>, dir: Pair<Float,Float>): Pair<Float,Float> {
                var t = Float.MAX_VALUE
                if (dir.first > 0) t = min(t, (tableWidth - pos.first) / dir.first)
                else if (dir.first < 0) t = min(t, (0f - pos.first) / dir.first)
                if (dir.second > 0) t = min(t, (tableHeight - pos.second) / dir.second)
                else if (dir.second < 0) t = min(t, (0f - pos.second) / dir.second)
                return AimMath.pointOnLine(pos, dir, t)
            }
        }
        EOF

    - name: Create VisionAnalyzer.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/VisionAnalyzer.kt
        package com.example.aimai
        import android.graphics.Bitmap
        import android.graphics.Color
        object VisionAnalyzer {
            data class Ball(val x: Float, val y: Float, val radius: Float, val color: Int)
            fun detectBalls(screenBitmap: Bitmap): List<Ball> {
                return listOf(
                    Ball(500f, 800f, 28f, Color.WHITE),
                    Ball(750f, 600f, 28f, Color.RED)
                )
            }
            fun detectPockets(screenBitmap: Bitmap): List<Pair<Float,Float>> {
                return listOf(
                    Pair(50f, 50f), Pair(950f, 50f),
                    Pair(50f, 1550f), Pair(950f, 1550f)
                )
            }
        }
        EOF

    - name: Create OverlayRenderer.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/OverlayRenderer.kt
        package com.example.aimai
        import android.content.Context
        import android.graphics.*
        import android.view.View
        class OverlayRenderer(context: Context) : View(context) {
            private var currentPath: PhysicsEngine.PredictionPath? = null
            private val paintSolid = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.YELLOW; strokeWidth = 6f; style = Paint.Style.STROKE
            }
            private val paintDash = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.CYAN; strokeWidth = 5f; style = Paint.Style.STROKE
                pathEffect = DashPathEffect(floatArrayOf(25f, 15f), 0f)
            }
            private val paintGhost = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                color = Color.argb(120, 255, 0, 0); style = Paint.Style.FILL
            }
            fun setPath(path: PhysicsEngine.PredictionPath?) {
                currentPath = path; invalidate()
            }
            override fun onDraw(canvas: Canvas) {
                super.onDraw(canvas)
                val path = currentPath ?: return
                if (path.points.size < 2) return
                for (i in 0 until path.points.size - 1) {
                    val p1 = path.points[i]
                    val p2 = path.points[i+1]
                    val paint = if (i == 0) paintSolid else paintDash
                    canvas.drawLine(p1.first, p1.second, p2.first, p2.second, paint)
                    if (path.hitBall != null && i == path.points.size - 2) {
                        canvas.drawCircle(p2.first, p2.second, 30f, paintGhost)
                    }
                }
            }
        }
        EOF

    - name: Create FloatingAIService.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/FloatingAIService.kt
        package com.example.aimai
        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.IBinder
        import android.view.*
        import android.widget.Button
        import android.widget.Toast
        class FloatingAIService : Service() {
            private lateinit var windowManager: WindowManager
            private lateinit var overlayRenderer: OverlayRenderer
            private lateinit var floatingMenu: View
            private var allBalls: List<BallData> = emptyList()
            private var pockets: List<Pair<Float,Float>> = emptyList()
            override fun onBind(intent: Intent?): IBinder? = null
            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                overlayRenderer = OverlayRenderer(this)
                val overlayParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.MATCH_PARENT,
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                    else WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                    PixelFormat.TRANSLUCENT
                )
                windowManager.addView(overlayRenderer, overlayParams)
                floatingMenu = LayoutInflater.from(this).inflate(R.layout.floating_menu_ai, null)
                val menuParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                    else WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                )
                menuParams.gravity = Gravity.TOP or Gravity.START
                menuParams.x = 100; menuParams.y = 200
                windowManager.addView(floatingMenu, menuParams)
                setupListeners()
                initDemoData()
            }
            private fun initDemoData() {
                allBalls = listOf(
                    BallData(500f, 800f, 28f, android.graphics.Color.WHITE),
                    BallData(750f, 600f, 28f, android.graphics.Color.RED)
                )
                pockets = listOf(
                    Pair(50f, 50f), Pair(950f, 50f),
                    Pair(50f, 1550f), Pair(950f, 1550f)
                )
            }
            private fun setupListeners() {
                floatingMenu.findViewById<Button>(R.id.btnAnalyze).setOnClickListener {
                    runAIAnalysis()
                }
                floatingMenu.findViewById<Button>(R.id.btnSetWhite).setOnClickListener {
                    Toast.makeText(this, "White ball at (500,800)", Toast.LENGTH_SHORT).show()
                }
                floatingMenu.findViewById<Button>(R.id.btnSetTarget).setOnClickListener {
                    Toast.makeText(this, "Target ball at (750,600)", Toast.LENGTH_SHORT).show()
                }
                floatingMenu.findViewById<Button>(R.id.btnClose).setOnClickListener { stopSelf() }
            }
            private fun runAIAnalysis() {
                val cueBall = allBalls.firstOrNull { it.color == android.graphics.Color.WHITE }
                val targetBalls = allBalls.filter { it != cueBall }
                if (cueBall == null || targetBalls.isEmpty()) {
                    Toast.makeText(this, "No balls detected", Toast.LENGTH_SHORT).show()
                    return
                }
                var bestScore = Float.MAX_VALUE
                var bestPrediction: PhysicsEngine.PredictionPath? = null
                val engine = PhysicsEngine(1000f, 1600f)
                for (target in targetBalls) {
                    val direction = Pair(target.x - cueBall.x, target.y - cueBall.y)
                    val path = engine.computeFullPath(Pair(cueBall.x, cueBall.y), direction, allBalls, pockets)
                    if (path.points.size < bestScore) {
                        bestScore = path.points.size.toFloat()
                        bestPrediction = path
                    }
                }
                overlayRenderer.setPath(bestPrediction)
                val bounceCount = bestPrediction?.points?.size?.minus(1) ?: 0
                Toast.makeText(this, "✅ AI Best Path! $bounceCount bounces", Toast.LENGTH_LONG).show()
            }
            override fun onDestroy() {
                super.onDestroy()
                if (::overlayRenderer.isInitialized) windowManager.removeView(overlayRenderer)
                if (::floatingMenu.isInitialized) windowManager.removeView(floatingMenu)
            }
        }
        EOF

    - name: Create MainActivity.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/MainActivity.kt
        package com.example.aimai
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                findViewById<Button>(R.id.btnStart).setOnClickListener {
                    if (Settings.canDrawOverlays(this)) {
                        startService(Intent(this, FloatingAIService::class.java))
                    } else {
                        startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                    }
                }
                findViewById<Button>(R.id.btnStop).setOnClickListener {
                    stopService(Intent(this, FloatingAIService::class.java))
                }
                findViewById<Button>(R.id.btnAccessibility).setOnClickListener {
                    startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                }
            }
        }
        EOF

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew

    - name: Build APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-aim-pro
        path: app/build/outputs/apk/debug/*.apk
