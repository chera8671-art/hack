name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Clean everything and create fresh project
      run: |
        rm -rf app gradle build.gradle settings.gradle gradle.properties build
        mkdir -p app/src/main/java/com/example/aimai
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/xml

    - name: Create root build.gradle
      run: |
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:7.4.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
            }
        }
        EOF

    - name: Create settings.gradle
      run: |
        cat << 'EOF' > settings.gradle
        include ':app'
        rootProject.name = 'AIAimAssistant'
        EOF

    - name: Create gradle.properties
      run: |
        cat << 'EOF' > gradle.properties
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        android.enableJetifier=true
        EOF

    - name: Create app/build.gradle (SIMPLE AND CORRECT)
      run: |
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'kotlin-android'
        }

        android {
            namespace 'com.example.aimai'
            compileSdk 33

            defaultConfig {
                applicationId "com.example.aimai"
                minSdk 26
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

            kotlinOptions {
                jvmTarget = '1.8'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.8.0'
        }
        EOF

    - name: Create AndroidManifest.xml
      run: |
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <application
                android:allowBackup="true"
                android:label="AI Aim Assistant"
                android:theme="@style/Theme.AppCompat.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".FloatingAIService"
                    android:exported="false" />
            </application>
        </manifest>
        EOF

    - name: Create colors.xml
      run: |
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <color name="black">#FF000000</color>
            <color name="white">#FFFFFFFF</color>
        </resources>
        EOF

    - name: Create strings.xml
      run: |
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="app_name">AI Aim Assistant</string>
            <string name="accessibility_desc">Accessibility Service</string>
        </resources>
        EOF

    - name: Create activity_main.xml
      run: |
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:gravity="center"
            android:padding="16dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="AI Aim Assistant"
                android:textSize="24sp"
                android:textStyle="bold"
                android:layout_marginBottom="24dp"/>
            <Button
                android:id="@+id/btnStart"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Start AI Assistant"/>
            <Button
                android:id="@+id/btnStop"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="Stop"
                android:layout_marginTop="12dp"/>
        </LinearLayout>
        EOF

    - name: Create floating_menu_ai.xml
      run: |
        cat << 'EOF' > app/src/main/res/layout/floating_menu_ai.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="wrap_content"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:background="#CC000000"
            android:padding="12dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="🎯 AI Aim"
                android:textColor="#FFD700"
                android:layout_marginBottom="8dp"/>
            <Button
                android:id="@+id/btnAnalyze"
                android:text="AI Analyze"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"/>
            <Button
                android:id="@+id/btnClose"
                android:text="Close"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="8dp"/>
        </LinearLayout>
        EOF

    - name: Create bg_floating_ai.xml
      run: |
        cat << 'EOF' > app/src/main/res/drawable/bg_floating_ai.xml
        <?xml version="1.0" encoding="utf-8"?>
        <shape xmlns:android="http://schemas.android.com/apk/res/android">
            <solid android:color="#CC000000"/>
            <corners android:radius="16dp"/>
        </shape>
        EOF

    - name: Create accessibility_service_config.xml
      run: |
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_desc"
            android:notificationTimeout="100" />
        EOF

    - name: Create MainActivity.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/MainActivity.kt
        package com.example.aimai
        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)
                findViewById<Button>(R.id.btnStart).setOnClickListener {
                    if (Settings.canDrawOverlays(this)) {
                        startService(Intent(this, FloatingAIService::class.java))
                    } else {
                        startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                    }
                }
                findViewById<Button>(R.id.btnStop).setOnClickListener {
                    stopService(Intent(this, FloatingAIService::class.java))
                }
            }
        }
        EOF

    - name: Create FloatingAIService.kt
      run: |
        cat << 'EOF' > app/src/main/java/com/example/aimai/FloatingAIService.kt
        package com.example.aimai
        import android.app.Service
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.IBinder
        import android.view.*
        import android.widget.Button
        import android.widget.Toast
        class FloatingAIService : Service() {
            private lateinit var windowManager: WindowManager
            private lateinit var overlayView: View
            private lateinit var floatingMenu: View
            override fun onBind(intent: Intent?): IBinder? = null
            override fun onCreate() {
                super.onCreate()
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                overlayView = View(this).apply {
                    setBackgroundColor(android.graphics.Color.TRANSPARENT)
                }
                val overlayParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.MATCH_PARENT,
                    WindowManager.LayoutParams.MATCH_PARENT,
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                    else WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                    PixelFormat.TRANSLUCENT
                )
                windowManager.addView(overlayView, overlayParams)
                floatingMenu = LayoutInflater.from(this).inflate(R.layout.floating_menu_ai, null)
                val menuParams = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O)
                        WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                    else WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                )
                menuParams.gravity = Gravity.TOP or Gravity.START
                menuParams.x = 100
                menuParams.y = 200
                windowManager.addView(floatingMenu, menuParams)
                floatingMenu.findViewById<Button>(R.id.btnAnalyze).setOnClickListener {
                    Toast.makeText(this, "AI Analysis Active", Toast.LENGTH_SHORT).show()
                }
                floatingMenu.findViewById<Button>(R.id.btnClose).setOnClickListener {
                    stopSelf()
                }
            }
            override fun onDestroy() {
                super.onDestroy()
                if (::overlayView.isInitialized) windowManager.removeView(overlayView)
                if (::floatingMenu.isInitialized) windowManager.removeView(floatingMenu)
            }
        }
        EOF

    - name: Create empty stub files
      run: |
        echo "package com.example.aimai" > app/src/main/java/com/example/aimai/AimMath.kt
        echo "object AimMath" >> app/src/main/java/com/example/aimai/AimMath.kt
        echo "package com.example.aimai" > app/src/main/java/com/example/aimai/PhysicsEngine.kt
        echo "class PhysicsEngine" >> app/src/main/java/com/example/aimai/PhysicsEngine.kt
        echo "package com.example.aimai" > app/src/main/java/com/example/aimai/VisionAnalyzer.kt
        echo "object VisionAnalyzer" >> app/src/main/java/com/example/aimai/VisionAnalyzer.kt
        echo "package com.example.aimai" > app/src/main/java/com/example/aimai/OverlayRenderer.kt
        echo "class OverlayRenderer" >> app/src/main/java/com/example/aimai/OverlayRenderer.kt

    - name: Generate Gradle Wrapper
      run: |
        gradle wrapper --gradle-version 7.5
        chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ai-aim-assistant
        path: app/build/outputs/apk/debug/*.apk
