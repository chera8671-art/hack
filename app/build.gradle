plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.example.aimai'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.aimai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // OpenCV للرؤية الحاسوبية
    implementation 'com.quickbirdstudios:opencv:4.8.0.1'

    // MediaProjection (مدمج في Android SDK)
}
